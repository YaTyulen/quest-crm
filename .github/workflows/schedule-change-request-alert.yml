name: Schedule Change Request Alert

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Schedule change request document id
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: scripts

      - name: Send admin VK alert
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VK_COMMUNITY_TOKEN: ${{ secrets.VK_COMMUNITY_TOKEN }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: node scripts/send-schedule-change-request-alert.mjs
